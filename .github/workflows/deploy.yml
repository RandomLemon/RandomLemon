name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout maki
        uses: actions/checkout@v4
        with:
          repository: RandomLemon/maki
          # 跟踪上游默认分支最新提交。
          ref: main
          path: .maki

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".maki -> target"

      - name: Build site
        working-directory: .maki
        env:
          MAKI_CONTENT_DIR: ${{ github.workspace }}/content
          # 站点通过自定义域名 blog.int15.top 部署在根路径。
          MAKI_BASE_URL: /
        run: cargo run --release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .maki/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
